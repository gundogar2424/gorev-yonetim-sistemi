name: APK Derle (Lezzet Defteri)

# Lezzet Defteri, depodaki diger uygulamalardan AYRI bir projedir:
# yalnizca lezzet-defteri/ klasorunu derler, baska hicbir dosyaya dokunmaz.
on:
  workflow_dispatch: {}
  push:
    branches: [main, 'claude/**']
    paths:
      - 'lezzet-defteri/**'
      - '.github/workflows/lezzet-apk.yml'

permissions:
  contents: write

defaults:
  run:
    working-directory: lezzet-defteri

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lezzet-defteri/package-lock.json

      - name: Bağımlılıklar
        # onnxruntime-node (sunucu parcasi) uygulamada kullanilmaz; kurulum betikleri
        # atlanir. Simge ureten sharp'in betigi ise gerekli: yalnizca o calistirilir.
        run: |
          npm ci --ignore-scripts
          npm rebuild sharp

      - name: Web derlemesi
        run: npm run build
        env:
          APP_BUILD: ${{ github.run_number }}

      - name: Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Android projesini oluştur (Capacitor)
        run: npx cap add android

      - name: Web varlıklarını senkronla
        run: npx cap sync android

      - name: Android "Paylaş" menüsü (Instagram/TikTok'tan tek dokunuşla kaydet)
        run: |
          # 1) Uygulama, baska uygulamalarin "Paylas" listesinde gorunsun (duz metin/link)
          f=android/app/src/main/AndroidManifest.xml
          # Sira islenirken uygulama arka planda donmasin: bildirimli on plan servisi
          grep -q 'SiraServisi' "$f" || sed -i 's#</application>#    <service android:name=".SiraServisi" android:exported="false" android:foregroundServiceType="dataSync" />\n    </application>#' "$f"
          grep -q 'FOREGROUND_SERVICE_DATA_SYNC' "$f" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n</manifest>#' "$f"
          grep -q 'ACCESS_COARSE_LOCATION' "$f" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n</manifest>#' "$f"
          grep -q 'android.intent.action.SEND' "$f" || sed -i '0,/<\/activity>/s##    <intent-filter android:label="Lezzet: Tarif">\n                <action android:name="android.intent.action.SEND" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <data android:mimeType="text/plain" />\n            </intent-filter>\n        </activity>#' "$f"
          # Paylas menusunde ikinci secenek: "Lezzet: Mekan" (ayni uygulama, mekan olarak kaydeder)
          grep -q 'MekanPaylas' "$f" || sed -i 's#</application>#    <activity-alias android:name=".MekanPaylas" android:targetActivity=".MainActivity" android:exported="true" android:label="Lezzet: Mekan" android:icon="@mipmap/ic_launcher">\n            <intent-filter android:label="Lezzet: Mekan">\n                <action android:name="android.intent.action.SEND" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <data android:mimeType="text/plain" />\n            </intent-filter>\n        </activity-alias>\n    </application>#' "$f"
          grep -n -A4 "action.SEND" "$f"
          # 2) Paylasilan metni web katmanina ver (sayfa hazir olana kadar tekrar dener)
          d=android/app/src/main/java/com/lezzet/defteri
          mkdir -p "$d"
          cat > "$d/MainActivity.java" <<'JAVA'
          package com.lezzet.defteri;

          import android.content.Intent;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;
          import org.json.JSONObject;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(SiraEklentisi.class); // web katmani sira servisini buradan acar/kapatir
                  super.onCreate(savedInstanceState);
                  // Uygulama gorunmezken de web katmani onemli sayilsin (sira islenirken yavaslamasin)
                  if (Build.VERSION.SDK_INT >= 26) getBridge().getWebView().setRendererPriorityPolicy(WebView.RENDERER_PRIORITY_IMPORTANT, false);
                  paylasimiIsle(getIntent());
              }


              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  paylasimiIsle(intent);
              }

              private void paylasimiIsle(Intent intent) {
                  if (intent == null || !Intent.ACTION_SEND.equals(intent.getAction())) return;
                  String metin = intent.getStringExtra(Intent.EXTRA_TEXT);
                  if (metin == null || metin.trim().isEmpty()) return;
                  // "Lezzet: Mekan" seceneginden geldiyse mekan olarak islenir
                  String tur = intent.getComponent() != null && intent.getComponent().getClassName().endsWith("MekanPaylas") ? "mekan" : "";
                  intent.setAction(Intent.ACTION_MAIN); // ayni paylasim iki kez islenmesin
                  final String js = "(function(){if(typeof window.__lzPaylasim==='function'){window.__lzPaylasim("
                      + JSONObject.quote(metin) + "," + JSONObject.quote(tur) + ");return 'ok'}return 'bekle'})()";
                  dene(js, 0);
              }

              private void dene(final String js, final int sayac) {
                  if (getBridge() == null || getBridge().getWebView() == null) return;
                  final WebView wv = getBridge().getWebView();
                  wv.postDelayed(() -> wv.evaluateJavascript(js, sonuc -> {
                      if (sonuc != null && sonuc.contains("bekle") && sayac < 40) dene(js, sayac + 1);
                  }), sayac == 0 ? 300 : 500);
              }
          }
          JAVA
          sed -i 's/^          //' "$d/MainActivity.java"
          cat > "$d/SiraServisi.java" <<'JAVA'
          package com.lezzet.defteri;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;
          import androidx.core.app.NotificationCompat;

          // Tarif sirasi islenirken calisan on plan servisi: Android uygulamayi
          // arka planda/ekran kapaliyken dondurmaz; sira bitince kendiliginden kapanir.
          public class SiraServisi extends Service {
              static final String KANAL = "lz_sira";
              static final int NO = 4711;
              static boolean calisiyor = false;
              private PowerManager.WakeLock kilit;

              static Notification bildirim(Context c, String metin) {
                  NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (Build.VERSION.SDK_INT >= 26 && nm.getNotificationChannel(KANAL) == null) {
                      nm.createNotificationChannel(new NotificationChannel(KANAL, "Tarif sırası", NotificationManager.IMPORTANCE_LOW));
                  }
                  Intent ac = new Intent(c, MainActivity.class);
                  ac.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent pi = PendingIntent.getActivity(c, 0, ac, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  return new NotificationCompat.Builder(c, KANAL)
                      .setSmallIcon(android.R.drawable.stat_sys_download)
                      .setContentTitle("Lezzet Defteri")
                      .setContentText(metin == null || metin.isEmpty() ? "Paylaşımlar işleniyor…" : metin)
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .setContentIntent(pi)
                      .build();
              }

              static void guncelle(Context c, String metin) {
                  if (!calisiyor) return;
                  try {
                      ((NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE)).notify(NO, bildirim(c, metin));
                  } catch (Exception e) {
                      // bildirim izni yoksa servis yine calisir
                  }
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  String metin = intent != null ? intent.getStringExtra("metin") : null;
                  Notification n = bildirim(this, metin);
                  if (Build.VERSION.SDK_INT >= 29) startForeground(NO, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC);
                  else startForeground(NO, n);
                  calisiyor = true;
                  if (kilit == null) {
                      kilit = ((PowerManager) getSystemService(Context.POWER_SERVICE)).newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "lezzet:sira");
                      kilit.acquire(60 * 60 * 1000L); // en fazla 1 saat
                  }
                  return START_NOT_STICKY;
              }

              // Android 15: on plan suresi dolarsa nazikce kapan
              public void onTimeout(int startId, int fgsType) {
                  stopSelf();
              }

              @Override
              public void onDestroy() {
                  calisiyor = false;
                  if (kilit != null && kilit.isHeld()) kilit.release();
                  kilit = null;
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          JAVA
          sed -i 's/^          //' "$d/SiraServisi.java"
          cat > "$d/SiraEklentisi.java" <<'JAVA'
          package com.lezzet.defteri;

          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          // Web katmanindan: sira islenirken bildirimli servisi ac, guncelle, kapat
          @CapacitorPlugin(name = "LzSira")
          public class SiraEklentisi extends Plugin {
              @PluginMethod
              public void basla(PluginCall call) {
                  try {
                      Intent s = new Intent(getContext(), SiraServisi.class);
                      s.putExtra("metin", call.getString("metin", ""));
                      ContextCompat.startForegroundService(getContext(), s);
                  } catch (Exception e) {
                      // arka plandan baslatilamazsa sessizce gec
                  }
                  call.resolve();
              }

              @PluginMethod
              public void guncelle(PluginCall call) {
                  SiraServisi.guncelle(getContext(), call.getString("metin", ""));
                  call.resolve();
              }

              @PluginMethod
              public void bitir(PluginCall call) {
                  getContext().stopService(new Intent(getContext(), SiraServisi.class));
                  call.resolve();
              }

              // Kampanya gibi bilgilendirme bildirimi
              @PluginMethod
              public void bildir(PluginCall call) {
                  try {
                      Bildirim.goster(getContext(), call.getString("baslik", "Lezzet Defteri"), call.getString("metin", ""), call.getInt("no", 5000));
                  } catch (Exception e) {
                      // izin yoksa sessizce gec
                  }
                  call.resolve();
              }

              // Android 13+: bildirim izni iste (bir kez sorulur)
              @PluginMethod
              public void bildirimIzni(PluginCall call) {
                  if (Build.VERSION.SDK_INT >= 33 && getActivity() != null
                      && ContextCompat.checkSelfPermission(getContext(), Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(getActivity(), new String[] { Manifest.permission.POST_NOTIFICATIONS }, 4712);
                  }
                  call.resolve();
              }

          }
          JAVA
          sed -i 's/^          //' "$d/SiraEklentisi.java"
          cat > "$d/Bildirim.java" <<'JAVA'
          package com.lezzet.defteri;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import androidx.core.app.NotificationCompat;

          // Kampanya bildirimleri (dokununca uygulama acilir)
          public class Bildirim {
              static final String KANAL = "lz_kampanya";

              static void goster(Context c, String baslik, String metin, int no) {
                  NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (Build.VERSION.SDK_INT >= 26 && nm.getNotificationChannel(KANAL) == null) {
                      nm.createNotificationChannel(new NotificationChannel(KANAL, "Mekan kampanyaları", NotificationManager.IMPORTANCE_DEFAULT));
                  }
                  Intent ac = new Intent(c, MainActivity.class);
                  ac.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  PendingIntent pi = PendingIntent.getActivity(c, no, ac, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  nm.notify(no, new NotificationCompat.Builder(c, KANAL)
                      .setSmallIcon(android.R.drawable.star_on)
                      .setContentTitle(baslik)
                      .setContentText(metin)
                      .setStyle(new NotificationCompat.BigTextStyle().bigText(metin))
                      .setAutoCancel(true)
                      .setContentIntent(pi)
                      .build());
              }
          }
          JAVA
          sed -i 's/^          //' "$d/Bildirim.java"
          head -5 "$d/MainActivity.java"

      - name: Uygulama simgesi
        run: npx @capacitor/assets generate --assetPath assets --android --iconBackgroundColor '#fbf7f2' --iconBackgroundColorDark '#fbf7f2'

      - name: SDK sürümleri
        run: |
          v=android/variables.gradle
          sed -i -E "s/compileSdkVersion = [0-9]+/compileSdkVersion = 36/" "$v"
          sed -i -E "s/targetSdkVersion = [0-9]+/targetSdkVersion = 36/" "$v"
          sed -i -E "s/minSdkVersion = [0-9]+/minSdkVersion = 24/" "$v"

      - name: Sürüm kodunu artır
        run: |
          cd android/app
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"1.0.${{ github.run_number }}\"/" build.gradle

      - name: Sabit debug imza anahtarı (güncellemeler üstüne kurulabilsin)
        run: |
          mkdir -p ~/.android
          cp ../debug.keystore ~/.android/debug.keystore
          cp ../debug.keystore debug.keystore

      - name: APK derle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon -I ../../signing.gradle

      - name: APK'yı adlandır ve ziple
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk lezzet-defteri.apk
          zip -j lezzet-defteri-apk.zip lezzet-defteri.apk

      - name: APK'yı artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: lezzet-defteri-apk
          path: lezzet-defteri/lezzet-defteri.apk

      - name: Sürüm olarak yayınla
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lezzet-latest
          name: Lezzet Defteri APK
          body: |
            Instagram, TikTok, YouTube ya da tarif sitelerinden tarif kaydet;
            haftalık menü ve alışveriş listesi.
          files: |
            lezzet-defteri/lezzet-defteri.apk
            lezzet-defteri/lezzet-defteri-apk.zip
          make_latest: false

      - name: Deneme sürümü olarak yayınla (dal derlemeleri — doğrudan indirme linki)
        if: github.ref != 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lezzet-deneme
          target_commitish: ${{ github.sha }}
          name: Lezzet Defteri APK (deneme)
          prerelease: true
          body: |
            Geliştirme dalından derlenen deneme sürümü (derleme ${{ github.run_number }}).
            İndir, telefonda aç, "bilinmeyen kaynaklara izin ver" deyip kur.
            Chrome APK indirmede takılırsa lezzet-defteri-apk.zip'i indirip içindeki .apk'yı kur.
          files: |
            lezzet-defteri/lezzet-defteri.apk
            lezzet-defteri/lezzet-defteri-apk.zip
          make_latest: false
