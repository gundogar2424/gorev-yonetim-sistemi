name: APK Derle (Lezzet Defteri)

# Lezzet Defteri, depodaki diger uygulamalardan AYRI bir projedir:
# yalnizca lezzet-defteri/ klasorunu derler, baska hicbir dosyaya dokunmaz.
on:
  workflow_dispatch: {}
  push:
    branches: [main, 'claude/**']
    paths:
      - 'lezzet-defteri/**'
      - '.github/workflows/lezzet-apk.yml'

permissions:
  contents: write

defaults:
  run:
    working-directory: lezzet-defteri

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lezzet-defteri/package-lock.json

      - name: Bağımlılıklar
        # onnxruntime-node (sunucu parcasi) uygulamada kullanilmaz; kurulum betikleri
        # atlanir. Simge ureten sharp'in betigi ise gerekli: yalnizca o calistirilir.
        run: |
          npm ci --ignore-scripts
          npm rebuild sharp

      - name: Web derlemesi
        run: npm run build
        env:
          APP_BUILD: ${{ github.run_number }}

      - name: Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Android projesini oluştur (Capacitor)
        run: npx cap add android

      - name: Web varlıklarını senkronla
        run: npx cap sync android

      - name: Android "Paylaş" menüsü (Instagram/TikTok'tan tek dokunuşla kaydet)
        run: |
          # 1) Uygulama, baska uygulamalarin "Paylas" listesinde gorunsun (duz metin/link)
          f=android/app/src/main/AndroidManifest.xml
          grep -q 'android.intent.action.SEND' "$f" || sed -i '0,/<\/activity>/s##    <intent-filter>\n                <action android:name="android.intent.action.SEND" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <data android:mimeType="text/plain" />\n            </intent-filter>\n        </activity>#' "$f"
          grep -n -A4 "action.SEND" "$f"
          # 2) Paylasilan metni web katmanina ver (sayfa hazir olana kadar tekrar dener)
          d=android/app/src/main/java/com/lezzet/defteri
          mkdir -p "$d"
          cat > "$d/MainActivity.java" <<'JAVA'
          package com.lezzet.defteri;

          import android.content.Intent;
          import android.os.Bundle;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;
          import org.json.JSONObject;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  paylasimiIsle(getIntent());
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  paylasimiIsle(intent);
              }

              private void paylasimiIsle(Intent intent) {
                  if (intent == null || !Intent.ACTION_SEND.equals(intent.getAction())) return;
                  String metin = intent.getStringExtra(Intent.EXTRA_TEXT);
                  if (metin == null || metin.trim().isEmpty()) return;
                  intent.setAction(Intent.ACTION_MAIN); // ayni paylasim iki kez islenmesin
                  final String js = "(function(){if(typeof window.__lzPaylasim==='function'){window.__lzPaylasim("
                      + JSONObject.quote(metin) + ");return 'ok'}return 'bekle'})()";
                  dene(js, 0);
              }

              private void dene(final String js, final int sayac) {
                  if (getBridge() == null || getBridge().getWebView() == null) return;
                  final WebView wv = getBridge().getWebView();
                  wv.postDelayed(() -> wv.evaluateJavascript(js, sonuc -> {
                      if (sonuc != null && sonuc.contains("bekle") && sayac < 40) dene(js, sayac + 1);
                  }), sayac == 0 ? 300 : 500);
              }
          }
          JAVA
          sed -i 's/^          //' "$d/MainActivity.java"
          head -5 "$d/MainActivity.java"

      - name: Uygulama simgesi
        run: npx @capacitor/assets generate --assetPath assets --android --iconBackgroundColor '#fbf7f2' --iconBackgroundColorDark '#fbf7f2'

      - name: SDK sürümleri
        run: |
          v=android/variables.gradle
          sed -i -E "s/compileSdkVersion = [0-9]+/compileSdkVersion = 36/" "$v"
          sed -i -E "s/targetSdkVersion = [0-9]+/targetSdkVersion = 36/" "$v"
          sed -i -E "s/minSdkVersion = [0-9]+/minSdkVersion = 24/" "$v"

      - name: Sürüm kodunu artır
        run: |
          cd android/app
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"1.0.${{ github.run_number }}\"/" build.gradle

      - name: Sabit debug imza anahtarı (güncellemeler üstüne kurulabilsin)
        run: |
          mkdir -p ~/.android
          cp ../debug.keystore ~/.android/debug.keystore
          cp ../debug.keystore debug.keystore

      - name: APK derle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon -I ../../signing.gradle

      - name: APK'yı adlandır ve ziple
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk lezzet-defteri.apk
          zip -j lezzet-defteri-apk.zip lezzet-defteri.apk

      - name: APK'yı artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: lezzet-defteri-apk
          path: lezzet-defteri/lezzet-defteri.apk

      - name: Sürüm olarak yayınla
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lezzet-latest
          name: Lezzet Defteri APK
          body: |
            Instagram, TikTok, YouTube ya da tarif sitelerinden tarif kaydet;
            haftalık menü ve alışveriş listesi.
          files: |
            lezzet-defteri/lezzet-defteri.apk
            lezzet-defteri/lezzet-defteri-apk.zip
          make_latest: false
