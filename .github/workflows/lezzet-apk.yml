name: APK Derle (Lezzet Defteri)

on:
  workflow_dispatch: {}
  push:
    # Dal adi 'claude/**' olanlarda da derlenir: yeni ozellik main'e girmeden
    # telefonda denenebilsin. Surum olarak yayinlama yalnizca main'de yapilir.
    branches: [main, 'claude/**']
    paths:
      - 'src/lezzet/**'
      - 'src/index.css'
      - 'src/fonts/**'
      - 'lezzet.html'
      - 'public/lezzet-favicon.svg'
      - 'assets-lezzet/**'
      - 'capacitor.config.ts'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/lezzet-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      - name: Web derlemesi
        run: npm run build
        env:
          APP_BUILD: ${{ github.run_number }}

      - name: Lezzet Defteri'ni APK girişi yap
        run: cp dist/lezzet.html dist/index.html

      - name: Lezzet Defteri Capacitor ayarı (ayrı uygulama kimliği/adı)
        run: |
          # Diger programlardan AYRI kimlik/ad: telefonda yan yana durur,
          # biri digerinin uzerine yazmaz. Bu dosya yalnizca CI kopyasinda degisir.
          cat > capacitor.config.ts <<'CFG'
          import type { CapacitorConfig } from '@capacitor/cli'

          const config: CapacitorConfig = {
            appId: 'com.lezzet.defteri',
            appName: 'Lezzet Defteri',
            webDir: 'dist'
          }

          export default config
          CFG
          echo "--- capacitor.config.ts ---"; cat capacitor.config.ts

      - name: Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Varsayilan 'tools platform-tools' paketi yeni cmdline-tools'ta yok
          # ("Failed to find package 'tools'") ve adim cokuyor; yalnizca
          # platform-tools iste. Gerisini Gradle kendi indirir.
          packages: platform-tools

      - name: Kullanılmayan ağır eklentileri çıkar (APK küçülsün)
        run: |
          # Web derlemesi yukarida bitti. Lezzet Defteri yalnizca @capacitor/core
          # (CapacitorHttp ile link okuma dahil) ve @capacitor/status-bar kullanir;
          # digerlerini APK'ya koymaya gerek yok.
          # Once package.json'dan dusur (Capacitor eklenti listesini buradan okur),
          # sonra klasorleri sil. Bu yalnizca CI kopyasinda olur; depo degismez.
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));for(const k of ['@capacitor-community/speech-recognition','@capacitor-mlkit/barcode-scanning','@flomentumsolutions/capacitor-health-extended','@capacitor-community/contacts','@capacitor/geolocation','@capacitor/camera','@capacitor/share','@capacitor/local-notifications','@capacitor/filesystem']){if(p.dependencies)delete p.dependencies[k];if(p.devDependencies)delete p.devDependencies[k]}fs.writeFileSync('package.json',JSON.stringify(p,null,2))"
          rm -rf node_modules/@capacitor-community/speech-recognition
          rm -rf node_modules/@capacitor-mlkit/barcode-scanning
          rm -rf node_modules/@flomentumsolutions/capacitor-health-extended
          rm -rf node_modules/@capacitor-community/contacts
          rm -rf node_modules/@capacitor/geolocation
          rm -rf node_modules/@capacitor/camera
          rm -rf node_modules/@capacitor/share
          rm -rf node_modules/@capacitor/local-notifications
          rm -rf node_modules/@capacitor/filesystem
          echo "Eklentiler cikarildi."

      - name: Android projesini oluştur (Capacitor)
        run: npx cap add android

      - name: Web varlıklarını senkronla
        run: npx cap sync android

      - name: Uygulama simgesi (Lezzet Defteri'ne özel amblem)
        run: |
          # Kaynak: assets-lezzet/ (diger programlarin simgeleri degismez).
          npx @capacitor/assets generate --assetPath assets-lezzet --android --iconBackgroundColor '#fbf7f2' --iconBackgroundColorDark '#fbf7f2'
          echo "--- uretilen mipmap dosyalari ---"; ls -1 android/app/src/main/res/mipmap-xxxhdpi/ || true

      - name: SDK sürümleri
        run: |
          v=android/variables.gradle
          sed -i -E "s/compileSdkVersion = [0-9]+/compileSdkVersion = 36/" "$v"
          sed -i -E "s/targetSdkVersion = [0-9]+/targetSdkVersion = 36/" "$v"
          sed -i -E "s/minSdkVersion = [0-9]+/minSdkVersion = 24/" "$v"
          echo "--- variables.gradle ---"; grep -E "compileSdkVersion|targetSdkVersion|minSdkVersion" "$v"

      - name: Sürüm kodunu artır (her güncelleme üstüne kurulabilsin)
        run: |
          cd android/app
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"1.0.${{ github.run_number }}\"/" build.gradle
          grep -E "versionCode|versionName" build.gradle

      - name: Sabit debug imza anahtarı (güncellemeler üstüne kurulabilsin)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: APK derle (debug, sabit imza)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon -I ../signing.gradle

      - name: APK'yı yeniden adlandır
        run: cp android/app/build/outputs/apk/debug/app-debug.apk lezzet-defteri.apk

      - name: APK'yı ziple (Chrome APK indirme takılmasını atlatmak için)
        run: zip -j lezzet-defteri-apk.zip lezzet-defteri.apk

      - name: APK'yı artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: lezzet-defteri-apk
          path: lezzet-defteri.apk

      - name: Sürüm olarak yayınla (indirilebilir bağlantı)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lezzet-latest
          name: Lezzet Defteri APK
          body: |
            Instagram, TikTok, YouTube ya da tarif sitelerinden linki yapıştır; tarif
            deftere insin. Sofralar, haftalık yemek planı ve alışveriş listesi.

            İndir, telefonda aç, "bilinmeyen kaynaklara izin ver" diyip kur.

            Chrome APK indirmede %100'de takılıyorsa lezzet-defteri-apk.zip'i indir,
            Dosyalarım'da çıkart, içindeki .apk'yı kur.
          files: |
            lezzet-defteri.apk
            lezzet-defteri-apk.zip
          make_latest: false
