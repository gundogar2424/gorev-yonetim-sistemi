name: Saha CRM APK Derle

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    # CRM'in ciktisini etkileyen dosyalar degisince yeni APK uretilir.
    paths:
      - 'src/**'
      - 'index.html'
      - 'capacitor.config.ts'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/crm-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      - name: Web derlemesi
        run: npm run build
        env:
          APP_BUILD: ${{ github.run_number }}

      # CRM'in giris sayfasi zaten index.html; kopyalama gerekmez.

      - name: CRM Capacitor ayarı (ayrı uygulama kimliği/adı)
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli'

          // Saha CRM Android paketi (APK). Diyet uygulamasindan AYRI kimlik/ad
          // kullanir; boylece telefonda ayri bir uygulama olarak kurulur ve
          // digerinin uzerine yazmaz.
          const config: CapacitorConfig = {
            appId: 'com.sahacrm.app',
            appName: 'Saha CRM',
            webDir: 'dist'
          }

          export default config
          EOF
          echo "--- capacitor.config.ts ---"; cat capacitor.config.ts

      - name: Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android projesini oluştur (Capacitor)
        run: npx cap add android

      - name: Web varlıklarını senkronla
        run: npx cap sync android

      - name: Uygulama simgesi (CRM'e özel, teal konum pini)
        run: |
          # assets/ altindaki kaynaklardan Android launcher simgelerini uretir.
          # Boylece CRM, diger uygulamalardan farkli bir simgeyle gorunur.
          npx @capacitor/assets generate --android --iconBackgroundColor '#0f766e' --iconBackgroundColorDark '#0f766e'
          echo "--- uretilen mipmap dosyalari ---"; ls -1 android/app/src/main/res/mipmap-xxxhdpi/ || true

      - name: SDK sürümleri + eklenti yaması
        run: |
          v=android/variables.gradle
          sed -i -E "s/compileSdkVersion = [0-9]+/compileSdkVersion = 36/" "$v"
          sed -i -E "s/targetSdkVersion = [0-9]+/targetSdkVersion = 36/" "$v"
          # Depodaki health-extended eklentisi minSdk 26 ister (CRM kullanmasa da
          # node_modules'ta oldugundan senkronlanir); uyumluluk icin 26'ya cek.
          sed -i -E "s/minSdkVersion = [0-9]+/minSdkVersion = 26/" "$v"
          echo "--- variables.gradle ---"; grep -E "compileSdkVersion|targetSdkVersion|minSdkVersion" "$v"
          # health-extended build.gradle'i Kotlin eklentisini uygulamayi unutmus;
          # eksik satiri ekle ki derleme patlamasin (CRM bu eklentiyi cagirmasa da).
          h=node_modules/@flomentumsolutions/capacitor-health-extended/android/build.gradle
          grep -q "kotlin-android" "$h" || sed -i "s#^apply plugin: 'com.android.library'#apply plugin: 'com.android.library'\napply plugin: 'kotlin-android'#" "$h"
          # Ayni eklentideki cozulmeyen sabiti resmi izin metniyle degistir.
          k=$(find node_modules/@flomentumsolutions/capacitor-health-extended/android/src/main/java -name 'HealthPlugin.kt')
          sed -i 's#HealthPermission\.PERMISSION_READ_EXERCISE_ROUTE#"android.permission.health.READ_EXERCISE_ROUTE"#g' "$k"

      - name: İzinler (kamera + konum)
        run: |
          f=android/app/src/main/AndroidManifest.xml
          # Musteri/firma fotografi icin kamera + galeri
          grep -q 'android.permission.CAMERA' "$f" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' "$f"
          grep -q 'READ_MEDIA_IMAGES' "$f" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n</manifest>#' "$f"
          # GPS konumu ("Konumu Al")
          grep -q 'ACCESS_FINE_LOCATION' "$f" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n</manifest>#' "$f"
          echo "--- manifest izinleri ---"; grep -E "uses-permission|uses-feature" "$f" || true

      - name: Sürüm kodunu artır (her güncelleme üstüne kurulabilsin)
        run: |
          cd android/app
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"1.0.${{ github.run_number }}\"/" build.gradle
          grep -E "versionCode|versionName" build.gradle

      - name: Sabit debug imza anahtarı (güncellemeler üstüne kurulabilsin)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: APK derle (debug, sabit imza)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon -I ../signing.gradle

      - name: APK'yı yeniden adlandır
        run: cp android/app/build/outputs/apk/debug/app-debug.apk saha-crm.apk

      - name: APK'yı ziple (Chrome APK indirme takılmasını atlatmak için)
        run: zip -j saha-crm-apk.zip saha-crm.apk

      - name: APK'yı artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: saha-crm-apk
          path: saha-crm.apk

      - name: Sürüm olarak yayınla (indirilebilir bağlantı)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: saha-crm-latest
          name: Saha CRM APK
          body: |
            En güncel Saha CRM Android uygulaması.
            İndir, telefonda aç, "bilinmeyen kaynaklara izin ver" diyip kur.

            Chrome APK indirmede %100'de takılıyorsa saha-crm-apk.zip'i indir,
            Dosyalarım'da çıkart, içindeki .apk'yı kur.
          files: |
            saha-crm.apk
            saha-crm-apk.zip
          make_latest: false
