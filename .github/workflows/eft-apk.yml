name: APK Derle (EFT Dokunma)

on:
  workflow_dispatch: {}
  push:
    # Dal adi 'claude/**' olanlarda da derlenir: yeni ozellik main'e girmeden
    # telefonda denenebilsin. Surum olarak yayinlama yalnizca main'de yapilir.
    branches: [main, 'claude/**']
    paths:
      - 'src/eft/**'
      - 'src/index.css'
      - 'src/fonts/**'
      - 'eft.html'
      - 'assets-eft/**'
      - 'capacitor.config.ts'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/eft-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      - name: Web derlemesi
        run: npm run build
        env:
          APP_BUILD: ${{ github.run_number }}

      - name: EFT Dokunma uygulamasını APK girişi yap
        run: cp dist/eft.html dist/index.html

      - name: EFT Dokunma Capacitor ayarı (ayrı uygulama kimliği/adı)
        run: |
          # Diger dort programdan AYRI kimlik/ad: telefonda besi de yan yana durur,
          # biri digerinin uzerine yazmaz. Bu dosya yalnizca CI kopyasinda degisir.
          cat > capacitor.config.ts <<'CFG'
          import type { CapacitorConfig } from '@capacitor/cli'

          const config: CapacitorConfig = {
            appId: 'com.eft.dokunma',
            appName: 'EFT Dokunma',
            webDir: 'dist'
          }

          export default config
          CFG
          echo "--- capacitor.config.ts ---"; cat capacitor.config.ts

      - name: Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Kullanılmayan ağır eklentileri çıkar (APK küçülsün)
        run: |
          # Web derlemesi yukarida bitti. EFT Dokunma @capacitor/core,
          # @capacitor/status-bar ve @capacitor-community/text-to-speech (sesli
          # rehber; Android WebView web TTS'i desteklemedigi icin yerel motor)
          # kullanir; yedek ses (mespeak) saf JS'dir, yerel kod gerektirmez.
          # Izin gerektiren hicbir eklenti yok; digerlerini APK'ya
          # koymaya gerek yok.
          # Once package.json'dan dusur (Capacitor eklenti listesini buradan okur),
          # sonra klasorleri sil. Bu yalnizca CI kopyasinda olur; depo degismez.
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));for(const k of ['@capacitor-mlkit/barcode-scanning','@flomentumsolutions/capacitor-health-extended','@capacitor-community/contacts','@capacitor/geolocation','@capacitor/camera','@capacitor/filesystem','@capacitor/share','@capacitor/local-notifications']){if(p.dependencies)delete p.dependencies[k];if(p.devDependencies)delete p.devDependencies[k]}fs.writeFileSync('package.json',JSON.stringify(p,null,2))"
          rm -rf node_modules/@capacitor-mlkit/barcode-scanning
          rm -rf node_modules/@flomentumsolutions/capacitor-health-extended
          rm -rf node_modules/@capacitor-community/contacts
          rm -rf node_modules/@capacitor/geolocation
          rm -rf node_modules/@capacitor/camera
          rm -rf node_modules/@capacitor/filesystem
          rm -rf node_modules/@capacitor/share
          rm -rf node_modules/@capacitor/local-notifications
          echo "Eklentiler cikarildi."

      - name: Android projesini oluştur (Capacitor)
        run: npx cap add android

      - name: Web varlıklarını senkronla
        run: npx cap sync android

      - name: Uygulama simgesi (EFT Dokunma'ya özel amblem)
        run: |
          # Kaynak: assets-eft/ (diger programlarin simge klasorleri DEGISMEZ).
          npx @capacitor/assets generate --assetPath assets-eft --android --iconBackgroundColor '#0e8c8a' --iconBackgroundColorDark '#0e8c8a'
          echo "--- uretilen mipmap dosyalari ---"; ls -1 android/app/src/main/res/mipmap-xxxhdpi/ || true

      - name: SDK sürümleri
        run: |
          v=android/variables.gradle
          sed -i -E "s/compileSdkVersion = [0-9]+/compileSdkVersion = 36/" "$v"
          sed -i -E "s/targetSdkVersion = [0-9]+/targetSdkVersion = 36/" "$v"
          sed -i -E "s/minSdkVersion = [0-9]+/minSdkVersion = 24/" "$v"
          echo "--- variables.gradle ---"; grep -E "compileSdkVersion|targetSdkVersion|minSdkVersion" "$v"

      - name: İzinler (yalnızca titreşim)
        run: |
          f=android/app/src/main/AndroidManifest.xml
          grep -q 'VIBRATE' "$f" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>#' "$f"
          echo "--- manifest izinleri ---"; grep -E "uses-permission" "$f" || true

      - name: Sürüm kodunu artır (her güncelleme üstüne kurulabilsin)
        run: |
          cd android/app
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"1.0.${{ github.run_number }}\"/" build.gradle
          grep -E "versionCode|versionName" build.gradle

      - name: Sabit debug imza anahtarı (güncellemeler üstüne kurulabilsin)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: APK derle (debug, sabit imza)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon -I ../signing.gradle

      - name: APK'yı yeniden adlandır
        run: cp android/app/build/outputs/apk/debug/app-debug.apk eft-dokunma.apk

      - name: APK'yı ziple (Chrome APK indirme takılmasını atlatmak için)
        run: zip -j eft-dokunma-apk.zip eft-dokunma.apk

      - name: APK'yı artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: eft-dokunma-apk
          path: eft-dokunma.apk

      - name: Sürüm olarak yayınla (indirilebilir bağlantı)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: eft-latest
          name: EFT Dokunma APK
          body: |
            EFT (Duygusal Özgürleşme Tekniği) rehberli dokunma seansı: konuyu seç,
            0-10 puanla, kurulum cümlesi, 8 nokta sırayla ritimle vurulur, nefes,
            yeniden puan. Seans geçmişi ve ilerleme. Tamamen çevrimdışı.

            İndir, telefonda aç, "bilinmeyen kaynaklara izin ver" diyip kur.

            Chrome APK indirmede %100'de takılıyorsa eft-dokunma-apk.zip'i indir,
            Dosyalarım'da çıkart, içindeki .apk'yı kur.
          files: |
            eft-dokunma.apk
            eft-dokunma-apk.zip
          make_latest: false
