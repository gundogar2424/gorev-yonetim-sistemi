name: GitHub Pages'e Yayinla

# NOT: Otomatik web yayını KAPALI. Kullanıcı web'den veri girmekten vazgeçti;
# yalnızca APK kullanılıyor. Site son yayınlanan halinde kalır. Gerekirse
# Actions sekmesinden "Run workflow" ile elle tetiklenebilir.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
