<!doctype html>
<html lang="tr">

<title>Balıkçıoğlu Duvar</title>
<style>
  :root { --bg: #14202a; }

  body { display: flex; align-items: center; justify-content: center; overflow: hidden; }

<body>
<svg id="s" viewBox="0 0 540 960" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- dokular -->
  <filter id="rough" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="4" seed="4" result="n"/>
    <feDiffuseLighting in="n" lighting-color="#fff" surfaceScale="2.6" result="l"><feDistantLight azimuth="235" elevation="50"/></feDiffuseLighting>
    <feComposite in="l" in2="SourceGraphic" operator="arithmetic" k1="1.35" k2="0" k3="0" k4="0" result="lit"/>
    <feComposite in="lit" in2="SourceAlpha" operator="in"/>
  </filter>
  <filter id="stoneDrop" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="1.5" dy="2.5" stdDeviation="1.4" flood-color="#000" flood-opacity=".65"/></filter>
  <filter id="wood" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.9 0.012" numOctaves="3" seed="8" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 .22  0 0 0 0 .12  0 0 0 0 .05  -1.5 0 0 0 1.05" result="g"/>
    <feComposite in="g" in2="SourceAlpha" operator="in" result="g2"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="g2"/></feMerge>
  </filter>
  <filter id="woodH" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.006 0.35" numOctaves="3" seed="2" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 .3  0 0 0 0 .17  0 0 0 0 .07  -1.2 0 0 0 .85" result="g"/>
    <feComposite in="g" in2="SourceAlpha" operator="in" result="g2"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="g2"/></feMerge>
  </filter>
  <filter id="felt" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="2" seed="5" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .35 -.08" result="g"/>
    <feComposite in="g" in2="SourceAlpha" operator="in" result="g2"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="g2"/></feMerge>
  </filter>
  <filter id="cloudy" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.03" numOctaves="4" seed="11" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 .55  0 0 0 0 .53  0 0 0 0 .5  1.4 0 0 0 -.62" result="g"/>
    <feComposite in="g" in2="SourceAlpha" operator="in"/>
  </filter>
  <filter id="b1"><feGaussianBlur stdDeviation=".7"/></filter>
  <filter id="b4" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity=".28"/></filter>
  <filter id="cardSh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/></filter>

  <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f7fc4"/><stop offset=".6" stop-color="#9cc8e8"/><stop offset="1" stop-color="#f3d9a6"/></linearGradient>
  <linearGradient id="slatG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8e5a30"/><stop offset=".4" stop-color="#c38a55"/><stop offset="1" stop-color="#7d4d27"/></linearGradient>
  <linearGradient id="marbleG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfaf7"/><stop offset=".6" stop-color="#efece6"/><stop offset="1" stop-color="#e2ddd5"/></linearGradient>
  <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="glossStatic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/><stop offset=".55" stop-color="#fff" stop-opacity=".18"/><stop offset=".62" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="gDress" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b93a6"/><stop offset=".55" stop-color="#2f7a8c"/><stop offset="1" stop-color="#22606e"/></linearGradient>
  <linearGradient id="gShirt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4a82c0"/><stop offset=".55" stop-color="#3b6ea8"/><stop offset="1" stop-color="#2d578a"/></linearGradient>
  <linearGradient id="gKid" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f7c54e"/><stop offset=".55" stop-color="#f2b632"/><stop offset="1" stop-color="#d99a1c"/></linearGradient>
  <radialGradient id="gSkin" cx=".38" cy=".35" r=".75"><stop offset="0" stop-color="#f8d6b4"/><stop offset="1" stop-color="#e2b089"/></radialGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#ffe680" stop-opacity=".9"/><stop offset="1" stop-color="#ffe680" stop-opacity="0"/></radialGradient>

const momX = t => path(t, t < 10.8 ? [[0, -80], [2.5, 170], [10.8, 170]]
  : t < 16.95 ? [[10.8, 640], [11.6, 425], [12.4, 425], [12.9, 250], [13.9, 250], [14.4, 95], [15.8, 95], [16.95, -220]]
  : [[16.95, -60], [17.8, 270], [24.5, 270], [25.2, 110], [T, 110]]);

// kamera anahtar kareleri: [t, odakX, odakY, zoom]
const CAM = [[0, 270, 480, 1], [6.6, 270, 480, 1], [7.1, 170, 640, 1.38], [8.8, 170, 640, 1.38], [9.3, 270, 480, 1], [10.8, 270, 480, 1],
  [10.81, 270, 480, 1.0], [16.9, 270, 460, 1.07],
  [16.95, 270, 480, 1], [18.0, 270, 480, 1], [18.5, 270, 465, 1.04], [21.0, 270, 465, 1.04], [21.5, 270, 455, 1.1], [24.4, 270, 455, 1.1],
  [24.9, 270, 445, 1.16], [28.0, 270, 445, 1.16], [28.7, 270, 480, 1], [T, 270, 480, 1]];
function cam(t) {
  let a = CAM[0], b = CAM[CAM.length - 1];
  for (let i = 0; i < CAM.length - 1; i++) if (t >= CAM[i][0] && t <= CAM[i + 1][0]) { a = CAM[i]; b = CAM[i + 1]; break; }
  const k = io(p(t, a[0], b[0]));
  const z = lerp(a[3], b[3], k);
  const hx = 270 / z, hy = 480 / z;
  const fx = cl(lerp(a[1], b[1], k), hx, 540 - hx), fy = cl(lerp(a[2], b[2], k), hy, 960 - hy);
  return `translate(270,480) scale(${z}) translate(${-fx},${-fy})`;
}

function press(g, t, a, cx, cy) { // panel duvara bastırılıyor
  const k = p(t, a, a + .55);
  g.setAttribute('opacity', k > 0 ? Math.min(1, k * 2.5) : 0);
  scaleAt(g, lerp(1.12, 1, oc(k)), cx, cy);
}

function render(t) {
  $('cam').setAttribute('transform', cam(t));
  const storeO = Math.min(p(t, 10.55, 10.85), 1 - p(t, 16.85, 17.15));
  show('store', storeO); show('cart', storeO);
  const celebrate = t > 28.2 && t < 32;
  const hop = (ph = 0) => celebrate ? -Math.abs(Math.sin((t - 28.2) * Math.PI * 1.6 + ph)) * 34 : 0;
  const dip = Math.min(1, Math.abs(t - 10.8) / .25, Math.abs(t - 16.95) / .25);

  // ---- anne ----
  const { x, walk } = momX(t);
  const sw = Math.sin(t * Math.PI * 4) * 24 * walk;
  let aR = -8 + sw * .5, aL = 8 - sw * .5;
  const ramp = (a, b, from, to, f = .35) => lerp(from, to, io(p(t, a, a + f))) * (1 - p(t, b - f, b)) + from * p(t, b - f, b);
  if (t > 5.6 && t < 9.0) aR = ramp(5.6, 9.0, -8, -170, .4);
  if (t > 9.1 && t < 10.6) aR = ramp(9.1, 10.6, -8, -150);
  [12.0, 13.5, 15.0].forEach(a => { if (t > a - .4 && t < a + .5) aR = ramp(a - .4, a + .5, -8, -140, .3); });
  if (t > 18.0 && t < 21.0) { aL = ramp(18.0, 21.0, 8, 100); aR = ramp(18.0, 21.0, -8, -100); }
  if (t > 21.5 && t < 24.5) { aL = ramp(21.5, 24.5, 8, 80); aR = ramp(21.5, 24.5, -8, -80); }
  if (t > 25.2 && t < 28.2) aR = ramp(25.2, 28.2, -8, -110);
  const up = io(p(t, 28.2, 28.5));
  if (celebrate) { aL = lerp(8, 160, up); aR = lerp(-8, -160, up); }
  let mood = 'big';
  if (t < 6.7) mood = 'smile'; else if (t < 9.0) mood = 'o';
  else if (t > 17.8 && t < 28.2) mood = 'smile';
  const er = [1.6, 4.4, 14.1, 19.5, 23.0, 26.6, 33].some(b => t > b && t < b + .12) ? 1.2 : 3.6;
  pose(mom, { x, hop: hop(), sw, aL, aR, mood, er, op: dip, ...(t > 6.8 && t < 9.0 ? {} : {}),
    shake: (t > 6.9 && t < 9.0 ? -8 * io(p(t, 6.9, 7.3)) * (1 - p(t, 8.7, 9.0)) : 0) + (t < 2.6 ? 6 * io(p(t, 1.0, 1.4)) * (1 - p(t, 2.2, 2.6)) : 0), sweat: 0 });
  mom.phone.setAttribute('opacity', t > 5.8 && t < 8.8 ? 1 : 0);

  // ---- aile ----
  let on = false, fwalk = 0, kx = -300, mx = -300;
  if (t >= 10.8 && t < 16.95) { on = true; fwalk = walk; kx = x + 68; mx = x + 140; }
  else if (t >= 27.8) { const k = io(p(t, 27.8, 28.6)); fwalk = t < 28.6 ? 1 : 0; kx = lerp(620, 315, k); mx = lerp(700, 410, k); on = true; }
  const fop = on ? (t < 16.95 ? dip : 1) : 0;
  const fsw = Math.sin(t * Math.PI * 4 + 1) * 24 * fwalk;
  const fArms = celebrate ? { aL: lerp(8, 160, up), aR: lerp(-8, -160, up) } : {};
  pose(kid, { x: kx, hop: hop(.6), sw: fsw, mood: celebrate ? 'big' : 'smile', op: fop, ...fArms,
    ...(t > 14.7 && t < 16.4 ? { aR: ramp(14.7, 16.4, -8, -120) } : {}) });
  pose(man, { x: mx, hop: hop(1.2), sw: fsw, mood: celebrate ? 'big' : 'smile', op: fop, ...fArms,
    ...(t > 10.8 && t < 16.95 ? { aR: -60 } : {}) });
  $('cartPos').setAttribute('transform', `translate(${mx + 78},890)`);

  // ---- balon / fiyat / ampul ----
  show('bdot1', fade(t, 2.5, 5.5, .15)); show('bdot2', fade(t, 2.65, 5.5, .15));
  const ck = pop(t, 2.8, 5.5, .5); show('cloud', ck ? 1 : 0); scaleAt('cloud', ck, 350, 420);
  const pk = pop(t, 6.7, 9.0, .45); show('price', pk ? 1 : 0);
  scaleAt('price', pk, 330, 330);
  const bk = pop(t, 9.1, 10.6, .4); show('bulb', bk ? 1 : 0);
  $('bulbPos').setAttribute('transform', `translate(${x},${560 + Math.sin(t * 6) * 3}) scale(${bk})`);

  // ---- mağaza: seçimler (sağdan sola) ----
  [[12.0, 'sp3', 2, 'cb1', 425], [13.5, 'sp2', 1, 'cb2', 250], [15.0, 'sp1', 0, 'cb3', 95]].forEach(([a, sp, ci, cb, cx]) => {
    const k = t < a ? 0 : bo(p(t, a, a + .4));
    show(checks[ci].g, k ? 1 : 0); scaleAt(checks[ci].g, k, checks[ci].cx, 240);
    const bump = t > a - .1 && t < a + .5 ? Math.sin(p(t, a - .1, a + .5) * Math.PI) * .05 : 0;
    scaleAt(sp, 1 + bump, cx, 370);
    show(cb, t > a + .1 ? 1 : 0);
    $(cb).setAttribute('transform', `translate(0,${(1 - bounce(p(t, a + .1, a + .5))) * -60})`);
  });

  // ---- eve gelen kutular ----
  ['bx1', 'bx2', 'bx3'].forEach((id, i) => {
    const a = 17.3 + i * .18, k = p(t, a, a + .6);
    $(id).setAttribute('transform', `translate(0,${(1 - bounce(k)) * -800})`);
    show(id, t > a ? 1 - p(t, 27.4, 27.8) : 0);
  });

  // ---- montaj ----
  press($('kayaL'), t, 18.5, 45, 437); press($('kayaR'), t, 18.9, 495, 437);
  press($('akuL'), t, 21.9, 134, 437); press($('akuR'), t, 22.5, 406, 437);
  press($('merW'), t, 25.3, 270, 437);
  const sk = p(t, 26.0, 26.8);
  sheen.setAttribute('x', lerp(120, 420, io(sk))); sheen.setAttribute('opacity', sk > 0 && sk < 1 ? 1 : 0);
  // televizyon sehpadan duvara, altına asma konsol
  const tvk = io(p(t, 26.9, 27.6));
  $('tv').setAttribute('transform', `translate(270,${lerp(594, 392, tvk)})`);
  show('oldStand', 1 - p(t, 26.9, 27.2));
  press($('console'), t, 27.35, 270, 610);
  show('tvOn', p(t, 27.8, 28.1)); show('tvGlow', .55 * p(t, 27.8, 28.4)); show('ledGlow', .8 * p(t, 27.9, 28.4));

  // ---- kutlama ----
  sparks.forEach((s, i) => {
    const k = celebrate ? Math.max(0, Math.sin((t - 28.2) * 3 + i * 1.3)) : 0;
    s.setAttribute('transform', `translate(${s.dataset.x},${s.dataset.y}) scale(${k}) rotate(${t * 60})`);
  });
  const ok = t < 28.4 ? 0 : Math.min(bo(p(t, 28.4, 28.85)), 1 - io(p(t, 31.7, 32.0)));
  show('cost', ok > 0 ? 1 : 0); scaleAt('cost', ok, 270, 212);
  ['cr0', 'cr1', 'cr2', 'cr3'].forEach((id, i) => show(id, p(t, 28.7 + i * .3, 28.95 + i * .3)));
  $('strike').setAttribute('stroke-dashoffset', 1 - io(p(t, 29.9, 30.3)));
  const tk = t < 30.3 ? 0 : bo(p(t, 30.3, 30.7)); show('cr4', tk ? 1 : 0); scaleAt('cr4', tk, 0, 97);

  { const hk = t < 29.0 || t > 31.9 ? 0 : bo(p(t, 29.0, 29.45)); const hy = 600 - (t - 29) * 30;
    show('heart', hk ? Math.min(1, 1 - p(t, 31.4, 31.9)) : 0); $('heart').setAttribute('transform', `translate(270,${hy}) scale(${hk * 2.2})`); }
  // ---- altyazı ----
  const c = CAPS.find(([a, b]) => t >= a && t <= b);
  if (c) {
    const o = fade(t, c[0], c[1], .25);
    $('capT').textContent = c[2];
    $('capT').setAttribute('font-size', c[2].length > 24 ? 21 : 24);
    $('cap').setAttribute('opacity', o);
    $('cap').setAttribute('transform', `translate(0,${(1 - o) * -12})`);
  } else $('cap').setAttribute('opacity', 0);

  // ---- kapanış ----
  const eb = p(t, 32, 32.6);
  show('end', eb ? 1 : 0); show('endBg', eb);
  const et = t < 32.4 ? 0 : bo(p(t, 32.4, 32.9));
  $('endTxt').setAttribute('opacity', Math.min(1, et));
  scaleAt('endTxt', .85 + .15 * et, 270, 480);
  [0, 1, 2].forEach(i => { const k = p(t, 34.4 + i * .5, 34.8 + i * .5); show('er' + i, k);
    $('er' + i).setAttribute('transform', `translate(${270 + (1 - oc(k)) * 60},${420 + i * 92})`); });
}
window.render = render;

if (location.hash.includes('capture')) {
  document.body.classList.add('capture');
  render(0);
} else {
  let start = performance.now();
  document.body.addEventListener('click', () => start = performance.now());
  const loop = now => { render(((now - start) / 1000) % T); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
